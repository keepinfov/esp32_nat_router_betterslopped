name: Build

# The point of this workflow is not just "does it compile": it also guards the
# flash budget. ota_0 is 1536 KiB and the C3/C5 images had quietly crept past
# 99% of it, which is only visible if something checks every build.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Seven jobs per push saturates the runner allowance quickly, and a queue of
# superseded runs delays the one that matters. Only the newest push on a branch
# is worth building.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IDF_BRANCH: release/v5.5

jobs:
  build:
    # Self-hosted. ESP-IDF is installed once into $HOME and reused rather than
    # pulled as a ~2 GB container image on every job, which is the whole point
    # of having a persistent runner: only the first run pays for the toolchain.
    # No Docker required.
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: esp32
            chip: esp32
            defaults: sdkconfig.defaults
          - name: esp32c3
            chip: esp32c3
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32c3
          - name: esp32c5
            chip: esp32c5
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32c5
          - name: esp32c6
            chip: esp32c6
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32c6
          - name: esp32s3
            chip: esp32s3
            defaults: sdkconfig.defaults;sdkconfig.defaults.esp32s3
          - name: wt32_eth01
            chip: esp32
            defaults: sdkconfig.defaults;sdkconfig.defaults.eth_common;sdkconfig.defaults.wt32_eth01
          - name: esp32_poe_iso
            chip: esp32
            defaults: sdkconfig.defaults;sdkconfig.defaults.eth_common;sdkconfig.defaults.esp32_poe_iso

    steps:
      - uses: actions/checkout@v4

      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # A self-hosted runner that dies mid-job uploads no logs, so record the
      # things that would explain it before doing any work.
      - name: Runner health
        shell: bash
        run: |
          echo "disk:";  df -h "$HOME" "$GITHUB_WORKSPACE" || true
          echo "memory:"; free -h 2>/dev/null || true
          echo "python: $(python3 --version 2>&1)"
          echo "git:    $(git --version)"
          echo "cmake:  $(cmake --version 2>&1 | head -1)"

      # Kept outside the workspace so it survives between runs. Honours an
      # IDF_PATH the runner already provides; otherwise clones once and only
      # fetches again when the release branch has moved.
      - name: Set up ESP-IDF
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${IDF_PATH:-}" ] && [ -d "${IDF_PATH}" ]; then
            echo "Using pre-installed IDF at $IDF_PATH"
          else
            IDF_PATH="$HOME/esp-idf"
            # Clone into a scratch directory and move it into place only once
            # it is complete. A cancelled run (the concurrency rule cancels
            # superseded ones) must not leave a half-cloned tree behind that
            # every later run then tries to fetch into.
            if [ ! -f "$IDF_PATH/.idf-ready" ]; then
              rm -rf "$IDF_PATH" "$IDF_PATH.partial"
              git clone --depth 1 --branch "$IDF_BRANCH" --recursive \
                  https://github.com/espressif/esp-idf.git "$IDF_PATH.partial"
              touch "$IDF_PATH.partial/.idf-ready"
              mv "$IDF_PATH.partial" "$IDF_PATH"
            fi
            echo "IDF_PATH=$IDF_PATH" >> "$GITHUB_ENV"
          fi
          # Only the chip this job builds. Installing all five at once pulls
          # several gigabytes of toolchain in one go, which is a lot to ask of
          # a small runner; jobs run serially and share $IDF_TOOLS_PATH, so the
          # set fills in over the matrix anyway and later jobs find theirs
          # already present.
          "$IDF_PATH/install.sh" "${{ matrix.chip }}"

      - name: Build ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          idf.py -B "build_${{ matrix.name }}" \
                 -D SDKCONFIG="sdkconfig.${{ matrix.name }}" \
                 -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" \
                 set-target ${{ matrix.chip }}
          idf.py -B "build_${{ matrix.name }}" \
                 -D SDKCONFIG="sdkconfig.${{ matrix.name }}" \
                 -D SDKCONFIG_DEFAULTS="${{ matrix.defaults }}" \
                 build

      - name: Check ota_0 headroom
        shell: bash
        run: |
          printf '| target | bytes | of slot | free | |\n|---|--:|--:|--:|---|\n' >> "$GITHUB_STEP_SUMMARY"
          python3 tools/check_app_size.py "build_${{ matrix.name }}" \
            --name "${{ matrix.name }}" --summary

      - name: Component sizes
        if: always()
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B "build_${{ matrix.name }}" size-components || true

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.name }}
          path: |
            build_${{ matrix.name }}/esp32_nat_router.bin
            build_${{ matrix.name }}/bootloader/bootloader.bin
            build_${{ matrix.name }}/partition_table/partition-table.bin
            build_${{ matrix.name }}/ota_data_initial.bin
          if-no-files-found: warn
